version: '3.8'

services:

  # ── ML training service ────────────────────────────────────────────────────
  ml:
    build:
      context: ./software/ml
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./software/ml/notebooks:/workspace/notebooks
      - ./software/ml/src:/workspace/src
      - ./software/ml/data:/workspace/data
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/src