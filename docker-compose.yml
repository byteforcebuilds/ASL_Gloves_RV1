version: '3.8'

services:

  # ── ML training service ────────────────────────────────────────────────────
  ml:
    build:
      context: ./software/ml
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./software/ml/notebooks:/workspace/notebooks
      - ./software/ml/src:/workspace/src
      - ./software/ml/data:/workspace/data
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/src

  # ── Gowin: Full synthesis + place & route + bitstream ─────────────────────
  gowin:
    build:
      context: ./firmware/devices/tang_nano_20k
      dockerfile: Dockerfile.gowin
    volumes:
      - ./firmware/devices/tang_nano_20k/gowin_eda_project:/workspace
    environment:
      - GOWIN_LICENSE_SERVER=106.55.34.119:10559
    working_dir: /workspace/asl_glove
    command: gw_sh scripts/full_flow.tcl

  # ── Gowin: Synthesis only ─────────────────────────────────────────────────
  gowin-synth:
    build:
      context: ./firmware/devices/tang_nano_20k
      dockerfile: Dockerfile.gowin
    volumes:
      - ./firmware/devices/tang_nano_20k/gowin_eda_project:/workspace
    environment:
      - GOWIN_LICENSE_SERVER=106.55.34.119:10559
    working_dir: /workspace/asl_glove
    command: gw_sh scripts/synth.tcl

  # ── Gowin: Place & route only ─────────────────────────────────────────────
  gowin-pnr:
    build:
      context: ./firmware/devices/tang_nano_20k
      dockerfile: Dockerfile.gowin
    volumes:
      - ./firmware/devices/tang_nano_20k/gowin_eda_project:/workspace
    environment:
      - GOWIN_LICENSE_SERVER=106.55.34.119:10559
    working_dir: /workspace/asl_glove
    command: gw_sh scripts/pnr.tcl

  # ── Gowin: Bitstream generation only ─────────────────────────────────────
  gowin-bitstream:
    build:
      context: ./firmware/devices/tang_nano_20k
      dockerfile: Dockerfile.gowin
    volumes:
      - ./firmware/devices/tang_nano_20k/gowin_eda_project:/workspace
    environment:
      - GOWIN_LICENSE_SERVER=106.55.34.119:10559
    working_dir: /workspace/asl_glove
    command: gw_sh scripts/bitstream.tcl

  # ── Simulation: Run all testbenches via GHDL ─────────────────────────────
  sim:
    build:
      context: ./firmware/devices/tang_nano_20k
      dockerfile: Dockerfile.gowin
    volumes:
      - ./firmware/devices/tang_nano_20k/gowin_eda_project:/workspace
    working_dir: /workspace/asl_glove
    command: bash scripts/sim.sh

  # ── Simulation: Single testbench (override command at runtime) ────────────
  # Usage: docker-compose run --rm sim-one tb_uart
  sim-one:
    build:
      context: ./firmware/devices/tang_nano_20k
      dockerfile: Dockerfile.gowin
    volumes:
      - ./firmware/devices/tang_nano_20k/gowin_eda_project:/workspace
    working_dir: /workspace/asl_glove
    entrypoint: bash scripts/sim_single.sh

  # ── Bambu HLS: C++ to Verilog ─────────────────────────────────────────────
  bambu:
    build:
      context: ./firmware/devices/tang_nano_20k
      dockerfile: Dockerfile.gowin
    volumes:
      - ./firmware/devices/tang_nano_20k/gowin_eda_project:/workspace
    working_dir: /workspace/asl_glove
    command: >
      bambu src/tcn_inference.cpp
        --top-fname=tcn_inference
        --clock-period=9.26
        -O3
        --generate-verilog
        --output-directory=src/generated/